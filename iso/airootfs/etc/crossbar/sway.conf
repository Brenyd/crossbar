# Crossbar session compositor config.
# Every app (the XMB, games, Discord…) is a tab in one tabbed workspace, so exactly
# one is visible at a time — like a console. The tab bar is shrunk to ~2px of black.

workspace_layout tabbed
default_border none
default_floating_border normal
font pango:monospace 1
titlebar_padding 1
titlebar_border_thickness 0
client.focused          #000000 #000000 #000000 #000000 #000000
client.focused_inactive #000000 #000000 #000000 #000000 #000000
client.unfocused        #000000 #000000 #000000 #000000 #000000

focus_follows_mouse no
focus_on_window_activation focus
seat * hide_cursor 3000
output * bg #000000 solid_color
input type:keyboard xkb_layout us

# The XMB window (page title "Crossbar") gets a mark so we can always find it.
for_window [title="^Crossbar$"] mark --add xmb
for_window [window_type="dialog"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [title="^Sign in$"] floating enable, resize set 1100 800, move position center

# Steam runs in the background: its main library window is tucked away so launching a
# game goes straight from the XMB to the game. (Sign-in and update dialogs still show.)
for_window [class="steam" title="^Steam$"] move scratchpad
for_window [class="steam" title="^Friends List$"] move scratchpad
# Games: full screen; Steam's own overlay (Shift+Tab / Steam button) works normally.
for_window [class="^steam_app_"] fullscreen enable

# Quick Menu (also the Guide/PS button, handled by crossbard, and a remappable key).
bindsym Super+Escape exec /usr/local/bin/crossbar-home
bindsym XF86HomePage exec /usr/local/bin/crossbar-home
# Terminal: the one built into Crossbar (Ctrl+Alt+Shift+T for a separate one if Crossbar is stuck)
bindsym Ctrl+Alt+t exec curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:7777/api/show-terminal
bindsym Ctrl+Alt+Shift+t exec foot
bindsym Ctrl+Alt+q kill
bindsym Ctrl+Alt+BackSpace exit

exec /usr/local/bin/crossbar-shell
