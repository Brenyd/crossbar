<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossbar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="waves"></canvas>
<div id="stage">
  <div id="clock"><span id="clock-date"></span><span id="clock-time"></span></div>
  <div id="demo-badge" hidden>DEMO LIBRARY</div>
  <div id="crumb" hidden><div class="crumb-ico"></div><div class="crumb-label"></div></div>
  <div id="cats"></div>
  <div id="column"></div>
  <div id="hint"></div>
  <div id="options" hidden><div class="opt-list"></div></div>
  <div id="toasts"></div>
  <div id="dialog" hidden>
    <div class="dlg-box">
      <div class="dlg-title"></div>
      <div class="dlg-body"></div>
      <div class="dlg-fields"></div>
      <div class="dlg-buttons"></div>
    </div>
  </div>
  <div id="boot"><div class="boot-logo"><svg viewBox="0 0 120 120"><path d="M20 60h80M60 20v80" /><circle cx="60" cy="60" r="44"/></svg><span>CROSSBAR</span></div></div>
</div>
<script src="icons.js"></script>
<script src="waves.js"></script>
<script src="xmb.js"></script>
</body>
</html>
