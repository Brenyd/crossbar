<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossbar</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
</head>
<body>
<div id="theme-bg" hidden></div>
<canvas id="waves"></canvas>
<div id="stage">
  <div id="clock"><span id="clock-date"></span><span id="clock-time"></span></div>
  <div id="demo-badge" hidden>DEMO LIBRARY</div>
  <div id="crumb" hidden><div class="crumb-ico"></div><div class="crumb-label"></div></div>
  <div id="cats"></div>
  <div id="column"></div>
  <div id="hint"></div>
  <div id="options" hidden><div class="opt-list"></div></div>
  <div id="viewer" hidden><img alt=""><div class="v-bar"><span class="v-cap"></span><span class="v-count"></span></div>
    <div class="v-hint"><b>◀ ▶</b>Browse <b>A</b>Slideshow <b>B</b>Back <b>Y</b>Hide info</div></div>
  <div id="quick" hidden><div class="q-bg"></div><div class="q-shade"></div>
    <div class="q-panel"><div class="q-head"><span class="q-kicker">QUICK MENU</span><div class="q-title"></div></div><div class="q-rows"></div>
    <div class="q-foot"><b>A</b>Select <b>◀ ▶</b>Adjust <b>B</b>Resume</div></div></div>
  <div id="term" hidden><div class="t-head"><span>TERMINAL</span><span class="t-hint">Esc Esc or B to close · the shell keeps running</span></div><div class="t-screen"></div></div>
  <div id="launch" hidden><div class="l-spin"></div><div class="l-title"></div><div class="l-sub">Starting…</div></div>
  <div id="toasts"></div>
  <div id="osk" hidden><div class="osk-keys"></div><div class="osk-hint"></div></div>
  <div id="dialog" hidden>
    <div class="dlg-box">
      <div class="dlg-title"></div>
      <div class="dlg-body"></div>
      <div class="dlg-fields"></div>
      <div class="dlg-buttons"></div>
    </div>
  </div>
  <div id="boot"><div class="boot-logo"><svg viewBox="0 0 120 120"><path d="M20 60h80M60 20v80" /><circle cx="60" cy="60" r="44"/></svg><span>CROSSBAR</span></div></div>
</div>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="icons.js"></script>
<script src="waves.js"></script>
<script src="xmb.js"></script>
<script src="osk.js"></script>
<script src="media.js"></script>
<script src="quick.js"></script>
<script src="social.js"></script>
<script src="terminal.js"></script>
<script src="files.js"></script>
<script src="iptv.js"></script>
<script src="settings.js"></script>
<script src="emulation.js"></script>
<script src="trophies.js"></script>
<script src="artwork.js"></script>
<script src="apps.js"></script>
<script src="theme.js"></script>
</body>
</html>
